name: eval-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "eval/**"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluation gate (offline, against committed baseline)
        run: |
          if [ -f eval/quality_report.json ]; then
            python eval/gate.py --report eval/quality_report.json
          else
            echo "No committed quality report; skipping gate."
          fi
